services:
  - type: web
    name: bio-astro-lab-chatbot
    runtime: python
    rootDir: Chat Bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_URL
        value: sqlite:///./data/astronaut_checkin.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MOCK_LLM
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_API_KEY
        sync: false
