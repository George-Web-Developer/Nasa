<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astronaut Psychological Check-in Assistant</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #chatWrapper {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    astro-chat {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
    }
  </style>
  <script src="/widget.js"></script>
</head>
<body>
  <div id="chatWrapper">
    <astro-chat id="astroChatElem"></astro-chat>
  </div>

  <script>
    // Parse URL query parameters to dynamically configure widget
    const params = new URLSearchParams(window.location.search);
    const apiBase = params.get("apiBase") || window.location.origin;
    const astronautId = params.get("astronautId") || "1";
    const missionDay = params.get("missionDay") || "42";
    const language = params.get("lang") || "en";

    const chatElem = document.getElementById("astroChatElem");
    chatElem.setAttribute("api-base", apiBase);
    chatElem.setAttribute("astronaut-id", astronautId);
    chatElem.setAttribute("mission-day", missionDay);
    if (language) {
      chatElem.setAttribute("language", language);
    }
  </script>
</body>
</html>
